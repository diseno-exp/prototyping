const FILTERS = [['Todas',null],['A–D','ABCD'],['E–H','EFGH'],['I–M','IJKLM'],['N–R','NÑOPQR'],['S–Z','STUVWXYZ']];
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const coll = new Intl.Collator('es',{sensitivity:'base',numeric:true});

const state = {svc:null, filter:0, selected:null, t0:Date.now(), taps:0, scrolls:0, filterTaps:0};
const $ = id => document.getElementById(id);

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-'+id));
}
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('show'), 2200);
}

function itemsFor(svc){
  const cats = svc === 'Hogar empresas' ? ['Hogar y Empresas'] : [svc];
  const list = DATA.filter(d => cats.includes(d.s));
  list.sort((a,b) => coll.compare(a.n,b.n) || coll.compare(a.c,b.c));
  // Empresas con más de un convenio: se muestra el convenio para diferenciarlas
  const cnt = {}; list.forEach(d => cnt[norm(d.n)] = (cnt[norm(d.n)]||0)+1);
  list.forEach(d => d.dup = cnt[norm(d.n)] > 1);
  return list;
}

function renderFilters(){
  $('filters').innerHTML = FILTERS.map(([l],i) =>
    `<button class="flt ${i===state.filter?'on':''}" data-f="${i}">${l}</button>`).join('');
}

function renderList(){
  const all = itemsFor(state.svc);
  const letters = FILTERS[state.filter][1];
  const items = letters ? all.filter(d => letters.includes(norm(d.n)[0])) : all;
  $('lgrid').innerHTML = items.length ? items.map((d,i) => {
    const on = state.selected && state.selected.nura === d.nura;
    return `<button class="emp ${on?'on':''}" data-nura="${d.nura}"><span class="nm"><b>${esc(d.n)}</b></span><span class="sel"></span></button>`;
  }).join('') : `<div class="empty">No hay empresas en este rango</div>`;
  $('list').scrollTop = 0;
  $('count').textContent = items.length + (items.length===1?' empresa':' empresas');
  updateArrows();
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function updateArrows(){
  const l = $('list');
  $('up').disabled = l.scrollTop <= 2;
  $('down').disabled = l.scrollTop + l.clientHeight >= l.scrollHeight - 2;
}

// Navegación
document.querySelectorAll('[data-na]').forEach(b => b.onclick = () => toast('Esta opción no está disponible en el prototipo'));
document.querySelector('[data-go="servicios"]').onclick = () => show('servicios');
document.querySelectorAll('[data-svc]').forEach(b => b.onclick = () => {
  state.svc = b.dataset.svc; state.filter = 0; state.selected = null;
  state.t0 = Date.now(); state.taps = 0; state.scrolls = 0; state.filterTaps = 0;
  show('empresas'); renderFilters(); renderList(); $('hint').classList.remove('show');
});
$('filters').onclick = e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  state.filter = +b.dataset.f; state.filterTaps++; renderFilters(); renderList();
};
$('lgrid').onclick = e => {
  const b = e.target.closest('[data-nura]'); if(!b) return;
  state.taps++;
  state.selected = DATA.find(d => String(d.nura) === b.dataset.nura);
  document.querySelectorAll('.emp.on').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); $('hint').classList.remove('show');
};
function rowTops(){
  const l = $('list'), base = l.getBoundingClientRect().top - l.scrollTop;
  const tops = [...new Set([...$('lgrid').children].map(c => Math.round(c.getBoundingClientRect().top - base)))];
  return tops.sort((a,b)=>a-b);
}
$('down').onclick = () => {
  state.scrolls++; const l = $('list'), bottom = l.scrollTop + l.clientHeight;
  const items = [...$('lgrid').children], base = l.getBoundingClientRect().top - l.scrollTop;
  const cut = items.find(c => c.getBoundingClientRect().bottom - base > bottom + 1);
  l.scrollTo({top: cut ? cut.getBoundingClientRect().top - base : l.scrollHeight});
};
$('up').onclick = () => {
  state.scrolls++; const l = $('list'), tops = rowTops();
  const target = l.scrollTop - l.clientHeight + 12;
  const t = tops.filter(v => v >= target && v < l.scrollTop)[0];
  l.scrollTo({top: t !== undefined ? t : Math.max(0, tops.filter(v => v < l.scrollTop).pop() || 0)});
};
$('list').addEventListener('scroll', updateArrows);
$('back').onclick = () => show('servicios');
$('fin-back').addEventListener('click', () => setTimeout(updateArrows));
$('next').onclick = () => {
  if(!state.selected){ $('hint').classList.add('show'); return; }
  const d = state.selected, secs = Math.round((Date.now()-state.t0)/1000);
  $('f-name').textContent = d.n;
  $('f-meta').textContent = `Convenio: ${d.c}` + (d.nura > 0 ? ` · NURA ${d.nura}` : '') + (d.d ? ` · ${d.d}` : '');
  $('f-metrics').textContent = `Servicio: ${state.svc} · Tiempo en la lista: ${secs} s · Toques en empresas: ${state.taps} · Uso de flechas: ${state.scrolls} · Cambios de filtro: ${state.filterTaps}`;
  show('fin');
};
$('fin-back').onclick = () => show('empresas');
$('fin-restart').onclick = $('reset').onclick = () => { state.selected = null; show('menu'); };
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  const cur = document.querySelector('.screen.on').id;
  show({ 's-servicios':'menu', 's-empresas':'servicios', 's-fin':'empresas' }[cur] || 'menu');
});

// Escalar el lienzo 1024×768 a la ventana
function fit(){
  const s = Math.min(innerWidth/1024, innerHeight/768);
  $('stage').style.transform = `scale(${s})`;
}
addEventListener('resize', fit); fit();
</script>
</body>
