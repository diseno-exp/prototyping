<head>

<title>Prototipo ATM · Pago de servicios públicos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#1d2633;font-family:'Poppins',sans-serif;-webkit-font-smoothing:antialiased}
  body{display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:1024px;height:768px;flex:none;position:relative;background:#f4f8fe;transform-origin:center center;overflow:hidden;user-select:none}
  button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}

  /* Encabezado */
  .hdr{position:absolute;left:1px;top:0;width:1024px;padding:8px 16px 0}
  .hdr-row{display:flex;align-items:center;gap:19px;width:958px;height:60px}
  .super{width:6px;height:60px;display:flex;flex-direction:column;justify-content:space-between}
  .super i{display:block;height:1px;background:#555}
  .hdr-main{display:flex;justify-content:space-between;align-items:center;width:933px}
  .logos{display:flex;align-items:center;gap:16.6px}
  .tiles{display:flex;gap:9.8px}
  .tile{width:38px;height:39.2px;border-radius:4.9px;background:linear-gradient(to left,#fafafa,#dfdfdf 98.6%);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:5.6px;line-height:1.05;font-weight:600;text-align:center}
  .tile b{width:9px;height:9px;border-radius:50%;margin-bottom:2px}
  .aval{width:99px;height:27px;position:relative}
  .aval small{position:absolute;left:13px;top:-2px;font-size:9px;color:#4d86d4;letter-spacing:1.2px}
  .aval strong{position:absolute;left:0;top:8px;font-size:19px;font-weight:700;letter-spacing:2px;color:#2f6fdc;line-height:1}
  .aval strong span{color:#3a63c4}
  .cajero{display:flex;align-items:center;gap:16px;height:60px}
  .cajero .vl{width:1px;height:52px;background:#e6e6e6}
  .cajero .t{display:flex;flex-direction:column;gap:12px;font-size:12px;text-align:center}
  .cajero .t span:last-child{color:#5c8ff8}
  .hline{height:1px;background:#e6e6e6;margin-top:16px;width:992px}

  .screen{position:absolute;inset:0;display:none}
  .screen.on{display:block}
  .h1{font-weight:700;font-size:40px;line-height:50px;letter-spacing:-.2px;text-align:center;color:#000}

  /* Tarjetas de menú */
  .menu{position:absolute;left:128px;width:768px;display:flex;flex-direction:column;align-items:center;gap:56px}
  .grid{display:flex;flex-direction:column;gap:24px}
  .grow{display:flex;justify-content:center}
  .card{width:200px;height:228px;background:#fff;border:1.19px solid #4d86d4;border-radius:14.3px;display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 0;transition:transform .08s,background .15s}
  .card:active{transform:scale(.97);background:#eef4ff}
  .card.sh{filter:drop-shadow(0 4.76px 2.38px rgba(157,168,178,.85))}
  .card p{font-weight:500;font-size:20px;line-height:24px;letter-spacing:.24px;text-align:center;color:#000}
  .av{width:92px;height:92px;border-radius:50%;background:#b2cfff;display:flex;align-items:center;justify-content:center}
  .av svg{width:62px;height:62px;fill:none;stroke:#00317e;stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round}

  /* Pantalla de empresas */
  .title3{position:absolute;left:512px;top:155px;transform:translateX(-50%);width:780px;line-height:40px}
  .nav{position:absolute;left:128px;top:227px;width:768px}
  .filters{display:flex;gap:10px}
  .flt{flex:1;height:48px;border-radius:10px;background:#fff;border:1px solid #ccd9e9;color:#00317e;font-weight:500;font-size:20px}
  .flt.on{background:#1479ff;border-color:#1479ff;color:#fff;font-weight:600}
  /* Sin scroll táctil ni de rueda: solo se navega con las flechas */
  .list{margin-top:24px;height:272px;overflow:hidden;touch-action:none;overscroll-behavior:none;scroll-behavior:smooth}
  .lpage{height:272px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:repeat(3,84px);grid-auto-flow:column;column-gap:16px;row-gap:10px;align-content:start}
  .emp{height:84px;background:#fff;border:1px solid #ccd9e9;border-radius:10px;padding:8px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left}
  .emp .nm{flex:1;min-width:0}
  .emp .nm b{display:block;font-weight:500;font-size:19px;line-height:22px;color:#152a46}
  .sel{width:28px;height:28px;border-radius:50%;border:2px solid #1479ff;flex:none;display:flex;align-items:center;justify-content:center}
  .emp.on{border:2px solid #1479ff;background:#eaf2ff;padding:7px 19px}
  .emp.on .sel::after{content:"";width:14px;height:14px;border-radius:50%;background:#1479ff}
  .empty{text-align:center;color:#5b6b82;font-size:18px;padding:100px 0}
  .arrow{position:absolute;left:937px;width:55px;height:54px;border-radius:50%;border:2px solid #1479ff;background:#f4f8fe;display:flex;align-items:center;justify-content:center;transition:opacity .15s}
  .arrow svg{width:22px;height:22px;stroke:#1479ff;stroke-width:2.6;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .arrow:disabled{opacity:.3;cursor:default}
  .count{position:absolute;left:927px;width:75px;top:372px;text-align:center;font-size:13px;color:#5b6b82;line-height:18px}
  .btn{position:absolute;top:638px;width:262px;height:89px;border-radius:12px;background:#fff;border:1px solid #1479ff;filter:drop-shadow(0 4px 2px rgba(157,168,178,.85));font-size:24px;line-height:36px;color:#000}
  .btn:active{background:#eef4ff}
  .hint{position:absolute;left:128px;width:768px;top:596px;text-align:center;color:#b42318;font-size:16px;opacity:0;transition:opacity .2s}
  .hint.show{opacity:1}

  .toast{position:absolute;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#152a46;color:#fff;padding:14px 24px;border-radius:12px;font-size:18px;opacity:0;pointer-events:none;transition:all .25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* Fin */
  .fin{position:absolute;left:128px;top:170px;width:768px;display:flex;flex-direction:column;align-items:center;gap:28px;text-align:center}
  .fin .box{background:#fff;border:1px solid #ccd9e9;border-radius:14px;padding:28px 36px;width:100%}
  .fin .box b{display:block;font-size:26px;color:#152a46;font-weight:600;line-height:34px}
  .fin .box span{display:block;color:#5b6b82;font-size:16px;margin-top:8px}
  .metrics{font-size:13px;color:#5b6b82}

  /* Facilitador */
  #fac{position:fixed;right:12px;bottom:12px;font:12px/1.3 'Poppins',sans-serif;color:#c6d3e6;opacity:.55}
  #fac:hover{opacity:1}
  #fac button{color:#fff;background:#33415a;border-radius:6px;padding:6px 10px;margin-left:6px}
</style>
</head>

  <!-- 2. Servicio público -->
  <section class="screen" id="s-servicios">

      <div class="grid">
        <div class="grow" style="gap:32px;width:680px">

          <button class="card" data-svc="Luz"><div class="av" data-ic="bolt"></div><p>Luz</p></button>

        </div>

    </div>
  </section>

  <!-- 3. Empresa -->
  <section class="screen" id="s-empresas">

    <div class="nav">
      <div class="filters" id="filters"></div>
      <div class="list" id="list"><div id="lgrid"></div></div>
    </div>
    <button class="arrow" id="up" style="top:296px" aria-label="Página anterior"><svg viewBox="0 0 24 24"><path d="M6 15l6-6 6 6"/></svg></button>
    <div class="count" id="count"></div>
    <button class="arrow" id="down" style="top:525px" aria-label="Página siguiente"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <div class="hint" id="hint">Selecciona una empresa para continuar</div>
    <button class="btn" style="left:128px" id="back">Regresar</button>
    <button class="btn" style="left:634px" id="next">Continuar</button>
  </section>

  <!-- 4. Fin de la prueba -->
  <section class="screen" id="s-fin">
    <div class="fin">
      <h1 class="h1">Seleccionaste</h1>
      <div class="box"><b id="f-name"></b><span id="f-meta"></span></div>
      <div class="metrics" id="f-metrics"></div>
    </div>
    <button class="btn" style="left:128px" id="fin-back">Regresar</button>
    <button class="btn" style="left:634px" id="fin-restart">Volver al inicio</button>
  </section>

  <div class="toast" id="toast"></div>
</div>

<div id="fac">Facilitador: <button id="reset">Reiniciar prueba</button></div>

const ICONS = {
  water:'<svg viewBox="0 0 48 48"><path d="M24 4a20 20 0 0 1 20 20"/><path d="M44 24a20 20 0 0 1-20 20M24 44A20 20 0 0 1 4 24M4 24A20 20 0 0 1 24 4" stroke-dasharray="3.2 3.2"/><path d="M24 14c4 5 6.5 8.5 6.5 12a6.5 6.5 0 0 1-13 0c0-3.5 2.5-7 6.5-12z"/></svg>',
  bolt:'<svg viewBox="0 0 48 48"><path d="M24 4a20 20 0 0 1 20 20"/><path d="M44 24a20 20 0 0 1-20 20M24 44A20 20 0 0 1 4 24M4 24A20 20 0 0 1 24 4" stroke-dasharray="3.2 3.2"/><path d="M26 13l-8 13h6l-2 9 8-13h-6z"/></svg>',
  flame:'<svg viewBox="0 0 48 48"><path d="M24 4a20 20 0 0 1 20 20"/><path d="M44 24a20 20 0 0 1-20 20M24 44A20 20 0 0 1 4 24M4 24A20 20 0 0 1 24 4" stroke-dasharray="3.2 3.2"/><path d="M24 34a7 7 0 0 0 7-7c0-5-4-7-5-12-3 3-4 5-4 7-1-1-2-2-2-4-2 2-3 5-3 9a7 7 0 0 0 7 7z"/></svg>',
  phone:'<svg viewBox="0 0 48 48"><path d="M15 9h5l3 7-3.5 2.5a19 19 0 0 0 10 10L32 25l7 3v5a4 4 0 0 1-4 4C21 36 12 27 11 13a4 4 0 0 1 4-4z"/></svg>',
  mobile:'<svg viewBox="0 0 48 48"><rect x="15" y="7" width="18" height="34" rx="3"/><path d="M21 36h6"/></svg>',
  home:'<svg viewBox="0 0 48 48"><path d="M8 23L24 9l16 14"/><path d="M12 20v19h24V20"/><path d="M20 39v-9a4 4 0 0 1 8 0v9"/></svg>',
  cart:'<svg viewBox="0 0 48 48"><path d="M6 12h5l5 18h18l5-14"/><circle cx="18" cy="37" r="2.5"/><circle cx="31" cy="37" r="2.5"/><path d="M27 12c-1-1.5-2-2-3.5-2s-3 1-3 2.5 1.2 2 3.2 2.6 3.3 1.2 3.3 2.8-1.5 2.6-3.3 2.6-3-.8-3.7-2M23.5 8v2M23.5 20.5v2"/></svg>'
};
document.querySelectorAll('[data-ic]').forEach(el => el.innerHTML = ICONS[el.dataset.ic]);

const PER_PAGE = 6; // 2 columnas × 3 filas; cada página se lee por columnas
const FILTERS = [['Todas',null],['A–D','ABCD'],['E–H','EFGH'],['I–M','IJKLM'],['N–R','NÑOPQR'],['S–Z','STUVWXYZ']];
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g,'').toUpperCase();
const coll = new Intl.Collator('es',{sensitivity:'base',numeric:true});

const state = {svc:null, filter:0, selected:null, page:0, pages:1, total:0, t0:Date.now(), taps:0, scrolls:0, filterTaps:0};
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === 's-'+id)); }
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function itemsFor(svc){
  return DATA.filter(d => d.s === svc).sort((a,b) => coll.compare(a.n,b.n) || coll.compare(a.c,b.c));
}

function renderFilters(){
  $('filters').innerHTML = FILTERS.map(([l],i) =>
    `<button class="flt ${i===state.filter?'on':''}" data-f="${i}">${l}</button>`).join('');
}

function renderList(){
  const letters = FILTERS[state.filter][1];
  const items = itemsFor(state.svc).filter(d => !letters || letters.includes(norm(d.n)[0]));
  const cards = items.map(d => {
    const on = state.selected && state.selected.nura === d.nura;
    return `<button class="emp ${on?'on':''}" data-nura="${d.nura}"><span class="nm"><b>${esc(d.n)}</b></span><span class="sel"></span></button>`;
  });
  let html = '';
  for(let p = 0; p < cards.length; p += PER_PAGE) html += `<div class="lpage">${cards.slice(p, p+PER_PAGE).join('')}</div>`;
  $('lgrid').innerHTML = items.length ? html : `<div class="empty">No hay empresas en este rango</div>`;
  state.total = items.length;
  state.pages = Math.max(1, Math.ceil(items.length / PER_PAGE));
  goPage(0, true);
}

function goPage(p, instant){
  state.page = Math.max(0, Math.min(state.pages-1, p));
  const l = $('list');
  l.scrollTo({top: state.page * l.clientHeight, behavior: instant ? 'instant' : 'smooth'});
  $('up').disabled = state.page <= 0;
  $('down').disabled = state.page >= state.pages-1;
  $('count').textContent = state.total ? `Página ${state.page+1} de ${state.pages}` : '';
}

// Navegación
document.querySelectorAll('[data-na]').forEach(b => b.onclick = () => toast('Esta opción no está disponible en el prototipo'));
document.querySelector('[data-go="servicios"]').onclick = () => show('servicios');
document.querySelectorAll('[data-svc]').forEach(b => b.onclick = () => {
  state.svc = b.dataset.svc; state.filter = 0; state.selected = null;
  state.t0 = Date.now(); state.taps = 0; state.scrolls = 0; state.filterTaps = 0;
  show('empresas'); renderFilters(); renderList(); $('hint').classList.remove('show');
});
$('filters').onclick = e => {
  const b = e.target.closest('[data-f]'); if(!b) return;
  state.filter = +b.dataset.f; state.filterTaps++; renderFilters(); renderList();
};
$('lgrid').onclick = e => {
  const b = e.target.closest('[data-nura]'); if(!b) return;
  state.taps++;
  state.selected = DATA.find(d => String(d.nura) === b.dataset.nura);
  document.querySelectorAll('.emp.on').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); $('hint').classList.remove('show');
};
$('down').onclick = () => { state.scrolls++; goPage(state.page + 1); };
$('up').onclick = () => { state.scrolls++; goPage(state.page - 1); };
// Bloquea rueda y gestos para que solo funcionen las flechas
$('list').addEventListener('wheel', e => e.preventDefault(), {passive:false});
$('list').addEventListener('touchmove', e => e.preventDefault(), {passive:false});

$('back').onclick = () => show('servicios');
$('next').onclick = () => {
  if(!state.selected){ $('hint').classList.add('show'); return; }
  const d = state.selected, secs = Math.round((Date.now()-state.t0)/1000);
  $('f-name').textContent = d.n;
  $('f-meta').textContent = `Convenio: ${d.c} · NURA ${d.nura}` + (d.d ? ` · ${d.d}` : '');
  $('f-metrics').textContent = `Servicio: ${state.svc} · Tiempo en la lista: ${secs} s · Toques en empresas: ${state.taps} · Uso de flechas: ${state.scrolls} · Cambios de filtro: ${state.filterTaps}`;
  show('fin');
};
$('fin-back').onclick = () => { show('empresas'); goPage(state.page, true); };
$('fin-restart').onclick = $('reset').onclick = () => { state.selected = null; show('menu'); };
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  const cur = document.querySelector('.screen.on').id;
  show({'s-servicios':'menu','s-empresas':'servicios','s-fin':'empresas'}[cur] || 'menu');
});

// Escala el lienzo 1024×768 a la ventana
function fit(){ $('stage').style.transform = `scale(${Math.min(innerWidth/1024, innerHeight/768)})`; }
addEventListener('resize', fit); fit();
</script>
